<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StreamLens right-back screen</title>
<!--
  Shown to viewers when the phone camera drops. Everything is set from the OBS script
  (Tools → Scripts → streamlens.lua) through the URL, so nobody has to edit this file.
-->
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    --brand: #3C3489;
    background: var(--brand) center / cover no-repeat;
    color: #fff;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    animation: fade-in 0.6s ease-out both;
  }
  body.has-photo::before {
    content: ""; position: fixed; inset: 0;
    background: color-mix(in srgb, var(--brand) 70%, transparent);
  }
  main { position: relative; text-align: center; max-width: 80vw; }
  #logo { max-width: 22vh; max-height: 22vh; margin-bottom: 4vh; display: none; }
  #name { font-size: 2.6vh; letter-spacing: 0.35vh; text-transform: uppercase; opacity: 0.85; margin-bottom: 3vh; }
  #message { font-size: 6.5vh; font-weight: 600; line-height: 1.25; margin: 0; }
  #sub { font-size: 3.2vh; opacity: 0.9; margin-top: 3vh; }
  #status { margin-top: 6vh; font-size: 2.4vh; opacity: 0.8; display: flex; gap: 1.2vh; align-items: center; justify-content: center; }
  .dots span {
    display: inline-block; width: 1.1vh; height: 1.1vh; margin: 0 0.4vh; border-radius: 50%; background: #fff;
    animation: pulse 1.4s infinite ease-in-out both;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  #audio { position: fixed; left: 4vh; bottom: 4vh; font-size: 2.4vh; opacity: 0.9; display: none; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<main>
  <img id="logo" alt="">
  <div id="name"></div>
  <p id="message"></p>
  <div id="sub"></div>
  <div id="status"><span class="dots"><span></span><span></span><span></span></span><span id="statusText"></span></div>
</main>
<div id="audio">🔊 Audio continues</div>
<script>
  const q = new URLSearchParams(location.search);
  const text = (id, value) => { document.getElementById(id).textContent = value || ""; };

  text("message", q.get("msg") || "Sorry for the inconvenience. We'll be right back.");
  text("sub", q.get("sub"));
  text("name", q.get("name"));
  text("statusText", q.get("status") || "Reconnecting");

  const color = q.get("color");
  if (color && /^#[0-9a-fA-F]{6}$/.test(color)) document.body.style.setProperty("--brand", color);

  const fileUrl = (p) => "file:///" + p.replace(/\\/g, "/").split("/").map(encodeURIComponent).join("/").replace("%3A", ":");

  const logo = q.get("logo");
  if (logo) {
    const img = document.getElementById("logo");
    img.src = fileUrl(logo);
    img.style.display = "inline-block";
  }

  const photo = q.get("photo");
  if (photo) {
    document.body.style.backgroundImage = `url("${fileUrl(photo)}")`;
    document.body.classList.add("has-photo");
  }

  if (q.get("audio") === "1") document.getElementById("audio").style.display = "block";
</script>
</body>
</html>
